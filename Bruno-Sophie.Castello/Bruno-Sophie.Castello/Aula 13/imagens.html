<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="imagens.css">
    <title>Revisão Imagens e Videos</title>
</head>
<body>
    <h1>Trabalho com Imagens</h1>
    <h2>Imagens responsiva basica</h2>
    <figure class="resp-bas">
        <img src="https://i.pinimg.com/736x/a4/fb/cc/a4fbcc34c5f22d2a4b1a6c662fdb4f32.jpg" alt="Imagen 1">
    </figure>
    <h2>Imagen com Recorte</h2>
    <figure class="img-rec">
        <img src="https://i.pinimg.com/736x/b8/91/26/b891265194917eef5fd6b75355ff8122.jpg" alt="Imagen 2">
    </figure>

    <h2>Imagem em formato de cards</h2>
    <figure class="img-card">
        <img src="https://i.pinimg.com/736x/da/d3/14/dad314f6accc7db6576891e872a004ae.jpg" alt="Imagen 3"> 
    </figure>

    <h2>Imagens Personalizadas</h2>
    <figure class="pers-img">
        <img src="cantor.jpg" alt="Imagen 4"> 
    </figure>

    <h2>Imagens em Grid</h2>
    <section class="sec-grid">
        <article class="img-grid">
        <img src="https://i.pinimg.com/736x/8f/6e/9e/8f6e9ea9ad779552b9287a453dad67fc.jpg" alt="Imagem 5">
    </article>
    <article class="img-grid">
        <img src="https://i.pinimg.com/736x/b7/9a/05/b79a05e31bf3948a93331558cb105e94.jpg" alt="Imagem 6">
    </article>
    <article class="img-grid">
        <img src="https://i.pinimg.com/1200x/1c/89/5e/1c895e48d3aee615063bf978a15d1682.jpg" alt="Imagem 7">
    </article>
    </section>

    <section class="video">
        <h2>Trailer do filme</h2>
        <iframe class="video-bd" width="560" height="315" src="https://www.youtube.com/embed/gi2QWNZ9jms?si=JdUM1hDMAiyYHuev" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </section>

</body>
</html>
